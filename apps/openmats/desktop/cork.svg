<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480">
  <!-- Cork granules: bumpy noise lit from the upper left. -->
  <filter id="c" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feDiffuseLighting surfaceScale="1.7" diffuseConstant="1.04" lighting-color="#c9a47a">
      <feDistantLight azimuth="225" elevation="58"/>
    </feDiffuseLighting>
  </filter>
  <!-- Darker and lighter flecks. -->
  <filter id="d" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.27  0 0 0 0 0.16  0 0 0 0 0.07  4 0 0 0 -2.3"/>
  </filter>
  <filter id="l" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.86  0 0 0 0 0.72  0 4 0 0 -2.45"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#c)"/>
  <rect width="100%" height="100%" filter="url(#d)"/>
  <rect width="100%" height="100%" filter="url(#l)"/>
</svg>
