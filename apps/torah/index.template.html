<!-- This page is made by build.mjs from index.template.html and the desktop app's two screens. Edit the template. -->
<script>
  // Light or dark: the switch in the header (desktop/wall.js) is remembered on this phone. The desktop
  // code reads it from the address, so put it there before that code runs.
  (function () {
    var q = new URLSearchParams(location.search), saved;
    try { saved = JSON.parse(localStorage.getItem('torah.theme')); } catch (e) {}
    if (!q.get('theme')) { q.set('theme', saved || 'light'); history.replaceState(null, '', '?' + q + location.hash); }
  })();
</script>
