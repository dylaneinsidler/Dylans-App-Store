<!doctype html>
<!-- The iPad / iPhone version of Dylan's Solar 42F: the desktop app's own files (desktop/, copied in by tools/build.mjs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solar 42F">
<meta name="theme-color" content="#26241f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Dylan's Solar 42F</title>
<link rel="stylesheet" href="../../shared/phone.css">
<link rel="stylesheet" href="desktop/style.css">
</head>
<body>
<!-- The menu bar -->
<nav id="menubar">
  <div class="brand"><span class="sun-dot"></span>Dylan's Solar 42F</div>
  <div class="menu" data-menu="file"><button>File</button>
    <div class="drop">
      <button data-do="new">New (start from a blank panel)</button>
      <button data-do="open">Open a patch…</button>
      <button data-do="save">Save this patch…</button>
      <hr>
      <button data-do="quit">Close</button>
    </div>
  </div>
  <div class="menu" data-menu="sounds"><button>Sounds</button>
    <div class="drop" id="soundsMenu"></div>
  </div>
  <div class="menu" data-menu="view"><button>View</button>
    <div class="drop">
      <button data-do="fit">Whole panel</button>
      <button data-do="zoom">Zoom in (drag an empty part to move around)</button>
      <button data-do="fullscreen">Full screen (F11)</button>
      <hr>
      <button data-do="cables">Hide the patch cables</button>
    </div>
  </div>
  <div class="menu" data-menu="help"><button>Help</button>
    <div class="drop">
      <button data-do="guide">User's Guide</button>
      <button data-do="quick">Quick start</button>
      <button data-do="keys">Keyboard shortcuts</button>
      <button data-do="test">Test the speakers</button>
      <hr>
      <button data-do="about">About</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="status">
    <span id="powerState">Power off</span>
    <span class="meter" title="How loud the sound leaving the synth is. If this moves and you hear nothing, the sound is going somewhere else: see Help > User's Guide, 'No sound'."><span id="meterBar"></span></span>
    <button id="panicBtn" title="Stop all sound: lets go of every HOLD, pad and held envelope (Esc)">■ Stop all sound</button>
  </div>
</nav>

<div id="stage"></div>

<!-- Messages: what a starter sound is and how to play it, tips -->
<div id="toast" hidden></div>

<!-- The power switch: browsers only let sound start after a click or a tap. -->
<div id="power">
  <button id="powerBtn" aria-label="Power on">
    <span class="sun"></span>
    <span class="big">POWER</span>
    <span class="small">click to switch on the SOLAR 42F</span>
  </button>
  <p class="turn">Turn the iPad sideways for the whole panel.</p>
</div>

<!-- Windows over the panel: the User's Guide, and the small notes (quick start, shortcuts, about) -->
<div id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-top"><b id="sheetTitle"></b><button id="sheetClose" title="Close (Esc)">✕</button></div>
    <iframe id="sheetFrame" title="User's Guide" hidden></iframe>
    <div id="sheetText"></div>
  </div>
</div>

<input type="file" id="openFile" accept=".json,application/json" hidden>

<script src="../../shared/phone.js" data-name="Dylan's Solar 42F" data-sound data-footer="off"></script>
<script src="desktop/engine.js"></script>
<script src="desktop/panel.js"></script>
<script src="desktop/sounds.js"></script>
<script src="desktop/app.js"></script>
</body>
</html>
