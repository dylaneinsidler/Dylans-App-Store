<!doctype html>
<html lang="en" class="flow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Co-Star">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Co-Star</title>
<link rel="stylesheet" href="desktop/wall.css">
<link rel="stylesheet" href="../../shared/phone.css">
<link rel="stylesheet" href="app.css">
<!-- This page is made by build.mjs from index.template.html and the desktop app's two screens. Edit the template. -->
</head>
<body>
<div class="topbar"><button class="pill" id="me-btn">Your birth details</button><div id="switches"></div></div>

<main class="screens" id="stage" hidden>
  <section class="screen" id="today-screen">
<header class="rise">
    <div class="who">
      <div class="name serif" id="name"></div>
      <div class="big3 mono" id="big3"></div>
    </div>
    <div class="wordmark serif" id="wordmark"></div>
    <div class="when">
      <div class="time serif" id="time"></div>
      <div class="date mono" id="date"></div>
    </div>
  </header>

  <section class="glance">
    <p class="greet rise" id="greet"></p>
    <h1 class="headline serif rise" id="headline"></h1>
    <p class="deck rise" id="deck"></p>
    <div class="portrait rise">
      <canvas id="portrait"></canvas>
      <div class="caption mono" id="caption"></div>
    </div>
    <ul class="pp rise" id="pp"></ul>
  </section>

  <section class="detail rise">
    <div class="week" id="week"></div>
    <div class="label through" id="through"></div>
    <p class="para" id="para"></p>
    <div class="dodont">
      <div><h3>Do</h3><ul id="dos"></ul></div>
      <div><h3>Don’t</h3><ul id="donts"></ul></div>
    </div>
    <div class="label transits-label">Your transits</div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="chart-side rise" hidden>
    <div class="now-showing" id="nowShowing"></div>
  </section>
  <svg id="wheel" class="rise" viewBox="-500 -500 1000 1000" hidden></svg>
  <canvas id="earth" class="rise" hidden></canvas>
  </section>
  <section class="screen" id="sky-screen">
    <div class="screen-name">Your chart</div>
<svg id="wheel" class="rise" viewBox="-500 -500 1000 1000"></svg>
  <canvas id="earth" class="rise"></canvas>

  <aside class="rise top">
    <div class="row"><span class="label">Transits</span><span class="aside-note" id="count"></span></div>
    <div class="transits" id="transits"></div>
  </aside>

  <section class="details rise" id="details" hidden>
    <div class="week mono" id="week"></div>
    <div class="label through" id="through"></div>
    <p class="para" id="para"></p>
    <div class="dodont">
      <div><h3>Do</h3><ul id="dos"></ul></div>
      <div><h3>Don’t</h3><ul id="donts"></ul></div>
    </div>
  </section>

  <aside class="rise low">
    <div class="left">
      <div class="planets" id="planets"></div>
      <p class="compare" id="compare"></p>
    </div>
    <div class="moon">
      <canvas id="moon"></canvas>
      <div>
        <h3 id="phase"></h3>
        <div class="facts" id="moonFacts"></div>
      </div>
    </div>
  </aside>
  </section>
</main>

<aside class="setup" id="setup" hidden>
  <h1>Co-Star</h1>
  <p>Your day and your chart, worked out from where the planets really are. To begin, tell it when and where you were born. It stays on this phone.</p>
  <form id="me-form">
    <label>Your first name<input id="f-name" autocomplete="given-name" required></label>
    <label>Birthday<input id="f-date" type="date" required></label>
    <label>Time you were born<input id="f-time" type="time"><small>The closer, the better: it sets your rising sign. Leave it empty if you don't know.</small></label>
    <label>Where you were born<input id="f-place" type="search" placeholder="Town or city" autocomplete="off" required></label>
    <ul id="f-results"></ul>
    <button class="pill solid" id="f-save" type="submit">Show my day</button>
    <button class="pill" id="f-cancel" type="button" hidden>Cancel</button>
  </form>
</aside>

<script src="../../shared/phone.js" data-name="Dylan's Co-Star"></script>
<script src="app.js"></script>
</body>
</html>
